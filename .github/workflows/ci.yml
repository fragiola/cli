# CI: the `fragiola` package's checks.
#
#   Checks        Biome, TypeScript, the tests (which build first: the end-to-end tests run the
#                 built binary).
#   Package       `pnpm check:package`: builds and packs the package with pnpm, checks what the
#                 tarball holds, runs publint and attw on it, then installs it with npm in a
#                 scratch project outside the repository and runs `fragiola --version`, both
#                 exports and an MCP handshake over stdio (scripts/check-package.ts).
#   Changesets    on a pull request, `pnpm changeset status` fails when the PR changes what the
#                 package ships (`changedFilePatterns` in .changeset/config.json) without adding
#                 a changeset. Skipped for the Version Packages PR (changeset-release/*), which
#                 consumes them.
#
# Tests run only on pull requests (and on a manual run): with one PR merged at a time, main is
# what its PR tested. A push to main runs release.yml: the Version Packages PR, or the npm
# publish (whose pack job runs `scripts/check-package.ts --tarballs` on the very tarball it
# publishes).

name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm typecheck

      - run: pnpm test

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # builds first, then packs, lints and smoke-tests the tarball
      - run: pnpm check:package

  changesets:
    name: Changesets
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `--since` diffs from the merge base with the base branch: the full history is needed
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: A changeset for every package change
        env:
          BASE_REF: ${{ github.base_ref }}
        run: pnpm changeset status --since="origin/$BASE_REF"
